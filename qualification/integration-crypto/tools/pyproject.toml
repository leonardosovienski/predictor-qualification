# integration-crypto: ferramentas da missão (release congelada do protocolo V2 de ENVELOPE_V2_FREEZE.json + jsonschema),
# só para os scripts da missão (fixtures congeladas, conferências de envelope, attestation).
# Instalação só por `uv sync --locked`; a wheel vem da URL da release e o uv.lock fixa o sha256.
[project]
name = "integration-crypto-tools"
version = "0"
requires-python = ">=3.13,<3.14"
dependencies = ["predictor-research-protocol==2.0.0rc2", "jsonschema>=4.23,<5"]

[tool.uv]
package = false

[tool.uv.sources]
predictor-research-protocol = { url = "https://github.com/leonardosovienski/ecosystem-predictor/releases/download/predictor-research-protocol-v2.0.0rc2/predictor_research_protocol-2.0.0rc2-py3-none-any.whl" }
