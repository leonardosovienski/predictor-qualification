# Missão stocks, D-16 (APPROVED): os 4 gates que exigem dado real — E2E, WINDOWS_SMOKE, SOAK e
# STOCKS_NEGATIVE_CONTROLS — no GitHub Actions ubuntu-latest + windows-latest, só com dados públicos
# (B3 COTAHIST, B3 eventos acionários, CVM FCA/VLMO) baixados no job pela URL oficial e conferidos
# contra o sha256 fixado em qualification/stocks/d16/SOURCES.json antes da execução. C:\STOCKS\data e
# DADOS_STOCKS.zip não entram. Nem os arquivos nem o painel são versionados ou publicados como
# artefato (D-11): o artefato leva só logs, manifesto e resultados. A trava da D-16 está em d16_run.sh.
# Só manual (como o crypto-d16.yml): as fontes são mutáveis (COTAHIST do ano corrente, API de eventos da B3,
# CVM), então rodar de novo exige fixar de novo o SOURCES.json (build_real_panel.py pin) antes; um gatilho de
# push refaria o run com o pin antigo e falharia fechado na conferência do sha256 (run 36001349055, no merge).
name: Stocks D-16 (dados reais públicos B3/CVM)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d16:
    name: ${{ matrix.role }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {role: linux-primary, os: ubuntu-latest}
          - {role: linux-controls, os: ubuntu-latest}
          - {role: windows-latest, os: windows-latest}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - run: uv python install 3.13
      - name: D-16 (${{ matrix.role }})
        shell: bash
        run: bash qualification/stocks/d16/d16_run.sh "$RUNNER_TEMP/out/${{ matrix.role }}" "${{ matrix.role }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-d16-${{ matrix.role }}
          path: ${{ runner.temp }}/out/${{ matrix.role }}
          if-no-files-found: error
