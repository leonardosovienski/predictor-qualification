# Missão stocks / gate SECRETS_CLEAN: gitleaks 8.24.3 (binário conferido pelo checksum publicado)
# sobre (1) a árvore qualification/stocks do repositório de evidência e (2) todos os commits do
# stocks-predictor entre o baseline e o final_commit (qualification/stocks/secrets_target.json).
# Os relatórios SARIF são redigidos (--redact) e vão como artefato.
name: Stocks secrets scan

on:
  workflow_dispatch:
  push:
    paths:
      - qualification/stocks/secrets_target.json
      - .github/workflows/stocks-secrets.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: gitleaks
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"; cd "$RUNNER_TEMP"
          V=8.24.3
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" sums.txt | sha256sum -c - | tee "$OUT/gitleaks_checksum.log"
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          T="$GITHUB_WORKSPACE/qualification/stocks/secrets_target.json"
          BASE=$(python3 -c "import json;print(json.load(open('$T'))['base'])"); HEAD=$(python3 -c "import json;print(json.load(open('$T'))['head'])")
          ./gitleaks dir "$GITHUB_WORKSPACE/qualification/stocks" --redact --exit-code 2 \
            --report-format sarif --report-path "$OUT/evidence_tree.sarif" > "$OUT/evidence_tree.log" 2>&1
          echo "[exit $?]" >> "$OUT/evidence_tree.log"
          git clone -q https://github.com/leonardosovienski/stocks-predictor.git src
          ./gitleaks git src --log-opts="$BASE..$HEAD" --redact --exit-code 2 \
            --report-format sarif --report-path "$OUT/stocks_diff.sarif" > "$OUT/stocks_diff.log" 2>&1
          echo "[exit $?]" >> "$OUT/stocks_diff.log"
          git -C src log --oneline "$BASE..$HEAD" > "$OUT/stocks_commits_scanned.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-secrets
          path: ${{ runner.temp }}/out
