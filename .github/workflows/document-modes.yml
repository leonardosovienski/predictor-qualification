# Declaração de MODE nos documentos de estado (vivo × snapshot). Só confere a declaração; biblioteca padrão.
name: Document modes
on:
  push:
    paths: ["README.md", "qualification/shared/*.md", "qualification/shared/scripts/check_modes.py", ".github/workflows/document-modes.yml"]
  pull_request:
    paths: ["README.md", "qualification/shared/*.md", "qualification/shared/scripts/check_modes.py", ".github/workflows/document-modes.yml"]
permissions:
  contents: read
jobs:
  modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python qualification/shared/scripts/check_modes.py
