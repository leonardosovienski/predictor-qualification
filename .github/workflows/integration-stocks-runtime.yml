# Missão integration-stocks (Etapa B): runtime suportado no Linux primário (GitHub Actions ubuntu-latest × 3.13, D-9,
# D-16) e no Windows secundário (windows-latest × 3.13, D-1, D-24). Instala só as wheels publicadas listadas em
# qualification/integration-stocks/runtime_targets.json (C3.1) em venvs limpos, a partir dos uv.lock dos commits finais
# (--require-hashes). Dados públicos B3/CVM baixados no job pela URL oficial e conferidos contra o pin do run
# (qualification/integration-stocks/data/SOURCES.json, fixado e commitado antes de cada run: D-16, D-21); o cripto
# integrado usa os dados públicos da Binance da Etapa A (.CHECKSUM). Nada disso é versionado nem publicado como artefato
# (o artefato leva logs, hashes, manifestos e resultados). Sem segredos.
#
# Disparo: manual (quando este arquivo estiver no main) ou push numa branch integration-stocks/runtime-<fases>-<n>.
# <fases> = nomes separados por "+": cleanroom contract e2e n1 isolation failures soak windows ("windows" = job
# windows-latest com E2E + restart). Não entra no CI de push/PR do repositório: só roda nessas branches (D-15).
name: integration-stocks runtime

on:
  workflow_dispatch:
    inputs:
      phases:
        description: "fases separadas por espaço: cleanroom contract e2e n1 isolation failures soak windows"
        required: true
        default: "cleanroom contract e2e n1 isolation failures"
  push:
    branches:
      - "integration-stocks/runtime-*"

permissions:
  contents: write   # só para devolver a saída bruta por branch integration-stocks/raw-<run>-<job> (o ambiente da missão não baixa artefatos)

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.p.outputs.linux }}
      windows: ${{ steps.p.outputs.windows }}
    steps:
      - id: p
        shell: bash
        env:
          INPUT_PHASES: ${{ inputs.phases }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_PHASES" ]; then PHASES="$INPUT_PHASES"; else
            spec="${REF_NAME#integration-stocks/runtime-}"; spec="${spec%-*}"; PHASES="${spec//+/ }"
          fi
          linux=""; windows=false
          for p in $PHASES; do if [ "$p" = windows ]; then windows=true; else linux="$linux $p"; fi; done
          echo "linux=${linux# }" >> "$GITHUB_OUTPUT"; echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "linux=[${linux# }] windows=$windows"
  linux:
    needs: plan
    if: needs.plan.outputs.linux != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - run: uv python install 3.13
      - name: fases
        shell: bash
        env:
          PHASES: ${{ needs.plan.outputs.linux }}
          GITHUB_TOKEN: ${{ github.token }}   # stack_wheels.py fetch (registro do cain, D-32): só leitura de releases públicas
        run: bash qualification/integration-stocks/scripts/ci_runtime.sh "$PHASES" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
      - name: sem dados versionáveis no artefato
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP/out" \( -name '*.zip' -o -name 'dataset-*.json' -o -name 'panel*.json' -o -name 'vlmo_source.json' \) -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-stocks-runtime-linux
          path: ${{ runner.temp }}/out
          if-no-files-found: error
      - name: Devolver saída bruta por branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          DEST: qualification/integration-stocks/RAW_LOGS/runtime/run${{ github.run_id }}
          BRANCH: integration-stocks/raw-${{ github.run_id }}-linux
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/evid"
          cd "$RUNNER_TEMP/evid" && git checkout -q -b "$BRANCH" && mkdir -p "$DEST"
          cp -R "$RUNNER_TEMP/out/." "$DEST/"
          ( cd "$DEST" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS )
          git add -A "$DEST"
          git -c user.name="integration-stocks-runtime" -c user.email="actions@users.noreply.github.com" commit -q -m "integration-stocks: saída bruta do run ${{ github.run_id }} (linux)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push -q "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "branch de evidência: $BRANCH"
  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - run: uv python install 3.13
      - name: E2E + restart (WINDOWS_SMOKE)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /c/q && export TMPDIR=/c/q   # raiz curta (MAX_PATH, como qualification/stocks/d16/d16_run.sh)
          bash qualification/integration-stocks/scripts/ci_runtime.sh "e2e" /c/q/w "$RUNNER_TEMP/out"
      - name: sem dados versionáveis no artefato
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP/out" \( -name '*.zip' -o -name 'dataset-*.json' -o -name 'panel*.json' -o -name 'vlmo_source.json' \) -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-stocks-runtime-windows
          path: ${{ runner.temp }}/out
          if-no-files-found: error
      - name: Devolver saída bruta por branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          DEST: qualification/integration-stocks/RAW_LOGS/runtime/run${{ github.run_id }}-windows
          BRANCH: integration-stocks/raw-${{ github.run_id }}-windows
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/evid"
          cd "$RUNNER_TEMP/evid" && git checkout -q -b "$BRANCH" && mkdir -p "$DEST"
          cp -R "$RUNNER_TEMP/out/." "$DEST/"
          ( cd "$DEST" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS )
          git add -A "$DEST"
          git -c user.name="integration-stocks-runtime" -c user.email="actions@users.noreply.github.com" commit -q -m "integration-stocks: saída bruta do run ${{ github.run_id }} (windows)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push -q "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "branch de evidência: $BRANCH"
  static:
    # conferências estáticas do ciclo (C21, C24.3 a/b/e/f, C15.1, SECRETS_CLEAN) com gh e clones completos; saída devolvida por branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - run: uv python install 3.13
      - name: conferências
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          PY="$(uv python find 3.13)"; OUT="$RUNNER_TEMP/static"; mkdir -p "$OUT" "$RUNNER_TEMP/clones"
          for r in cain ecosystem-predictor-cain cripto-predictor stocks-predictor brasileirao-predictor; do git clone -q "https://github.com/leonardosovienski/$r.git" "$RUNNER_TEMP/clones/$r"; done
          M=qualification/integration-stocks; ST=$(jq -r .stocks.commit $M/runtime_targets.json)
          echo "static run_at=$(date -u +%FT%TZ) stocks_final=$ST" | tee "$OUT/static.log"
          CYCLE=$(jq -r .cycle $M/runtime_targets.json); echo "cycle=$CYCLE" | tee -a "$OUT/static.log"
          "$PY" $M/scripts/hosted_ci.py "$M/hosted_ci_targets_${CYCLE}.json" "$OUT/hosted-ci" >> "$OUT/static.log" 2>&1; echo "hosted_ci exit $?" | tee -a "$OUT/static.log"
          "$PY" $M/scripts/contract_revalidation.py "$RUNNER_TEMP/clones/stocks-predictor" "$ST" $M "$OUT/contract-revalidation/static_checks.json" >> "$OUT/static.log" 2>&1; echo "contract_revalidation exit $?" | tee -a "$OUT/static.log"
          "$PY" $M/scripts/protected_check.py "$PWD" "$RUNNER_TEMP/clones" "$ST" "$OUT/protected/protected_check.json" >> "$OUT/static.log" 2>&1; echo "protected_check exit $?" | tee -a "$OUT/static.log"
          "$PY" $M/scripts/secrets_scan.py "$RUNNER_TEMP/clones" "$PWD" "$OUT/secrets/secrets_scan.json" >> "$OUT/static.log" 2>&1; echo "secrets_scan exit $?" | tee -a "$OUT/static.log"
          tail -20 "$OUT/static.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-stocks-static
          path: ${{ runner.temp }}/static
          if-no-files-found: error
      - name: Devolver saída bruta por branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          DEST: qualification/integration-stocks/RAW_LOGS/static/run${{ github.run_id }}
          BRANCH: integration-stocks/raw-${{ github.run_id }}-static
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/evid"
          cd "$RUNNER_TEMP/evid" && git checkout -q -b "$BRANCH" && mkdir -p "$DEST"
          cp -R "$RUNNER_TEMP/static/." "$DEST/"
          ( cd "$DEST" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS )
          git add -A "$DEST"
          git -c user.name="integration-stocks-runtime" -c user.email="actions@users.noreply.github.com" commit -q -m "integration-stocks: saída bruta do run ${{ github.run_id }} (static)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push -q "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "branch de evidência: $BRANCH"
