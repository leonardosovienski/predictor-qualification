# Missão integration-crypto (Etapa B): runtime suportado no Linux primário (GitHub Actions ubuntu-latest × 3.13,
# D-9 e D-16). Instala só as wheels publicadas listadas em qualification/integration-crypto/runtime_targets.json
# (C3.1) em venvs limpos, a partir dos uv.lock dos commits finais (--require-hashes). Dados públicos da Binance
# baixados no job e conferidos pelo .CHECKSUM publicado; não são versionados nem publicados como artefato (o
# artefato leva logs, hashes, MANIFEST e resultados). Sem segredos: nenhuma chave, conta ou API da Binance.
#
# Disparo: manual (quando este arquivo estiver no main) ou push numa branch integration-crypto/runtime-<fases>-<n>
# criada no mesmo commit da branch da missão (um workflow novo só pode ser disparado manualmente depois de estar no
# main). <fases> = nomes separados por "+": cleanroom contract e2e n1 isolation failures soak.
# Não entra no CI de push/PR do repositório: só roda nessas branches (D-15).
name: integration-crypto runtime

on:
  workflow_dispatch:
    inputs:
      phases:
        description: "fases separadas por espaço: cleanroom contract e2e n1 isolation failures soak"
        required: true
        default: "cleanroom contract e2e n1 isolation failures"
  push:
    branches:
      - "integration-crypto/runtime-*"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - run: uv python install 3.13
      - name: fases
        shell: bash
        env:
          INPUT_PHASES: ${{ inputs.phases }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_PHASES" ]; then PHASES="$INPUT_PHASES"; else
            spec="${REF_NAME#integration-crypto/runtime-}"; spec="${spec%-*}"; PHASES="${spec//+/ }"
          fi
          echo "fases: $PHASES"
          bash qualification/integration-crypto/scripts/ci_runtime.sh "$PHASES" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
      - name: sem dados versionáveis no artefato
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP/out" -name '*.zip' -delete
          find "$RUNNER_TEMP/out" -name 'dataset-*.json' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-crypto-runtime
          path: ${{ runner.temp }}/out
          if-no-files-found: error
