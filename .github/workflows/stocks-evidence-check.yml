# Missão stocks: valida cada ATTESTATION_PARTIAL_*/QUALIFICATION_ATTESTATION contra o
# ATTESTATION_SCHEMA.json (JSON Schema 2020-12) e as regras C7.1 conferíveis (1, 2, 3, 6)
# no commit do push. No Windows local nada é instalado (D-1), por isso roda aqui.
name: Stocks evidence check

on:
  workflow_dispatch:
  push:
    paths:
      - qualification/stocks/**
      - .github/workflows/stocks-evidence-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet "jsonschema==4.25.1"
      - name: Schema + C7.1 (partials são conferidos contra o FINDINGS/evidência do próprio commit)
        run: |
          set -e
          for f in qualification/stocks/ATTESTATION_PARTIAL_*.json qualification/stocks/QUALIFICATION_ATTESTATION.json; do
            [ -f "$f" ] || continue
            echo "== $f"
            python qualification/stocks/scripts/attest.py check "$f" --schema-only
          done
